# PRs de atualização (OWASP ASI04 / AST02, decisão D9). Toda atualização passa pelo CI e por
# revisão: nada é atualizado sozinho em produção.
version: 2
updates:
  # Os pacotes Python já respeitam os 14 dias pelo `exclude-newer` do pyproject.
  - package-ecosystem: "uv"
    directory: "/"
    schedule: {interval: "weekly"}
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly"}
    cooldown: {default-days: 14}
  # Imagens base sem espera: as atualizações delas são, quase sempre, correções de segurança.
  - package-ecosystem: "docker"
    directory: "/"
    schedule: {interval: "weekly"}
    # Só patches do Python 3.12. Trocar a versão do Python é decisão de projeto (requires-python),
    # não atualização de rotina (achado no PR #2, que propôs o 3.15).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule: {interval: "monthly"}
    cooldown: {default-days: 14}
