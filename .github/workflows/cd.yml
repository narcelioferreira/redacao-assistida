name: CD

# A cada push na main, publica a imagem no GHCR com a tag do SHA do commit. O deploy no Azure só
# roda depois do bootstrap (docs/deploy-azure.md), quando a variável AZURE_DEPLOY_ENABLED vale true.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-demo
  # Nunca cancelar um deploy no meio: um terraform apply interrompido deixa o estado travado.
  cancel-in-progress: false

# Actions fixadas por SHA de commit (decisão D9).
jobs:
  imagem:
    name: Publicar a imagem no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # publicar a imagem no GHCR do próprio repositório
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # A tag do SHA é a que vai para o Azure (decisão D3); a `main` é só referência humana.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Proveniência e SBOM anexados à imagem: dá para auditar de onde ela veio e o que contém.
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy no Azure (demo)
    needs: imagem
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read # checkout
      id-token: write # token OIDC trocado por um token do Azure, sem segredo guardado (decisão D5)
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_image: ghcr.io/${{ github.repository }}:${{ github.sha }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: terraform init (estado remoto, autenticado por OIDC)
        run: >-
          terraform init
          -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP"
          -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT"
          -backend-config="container_name=tfstate"
          -backend-config="key=demo.tfstate"
      - name: terraform apply
        run: terraform apply -auto-approve
      - name: URL da API
        id: saida
        run: echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
      - name: Smoke test (a revisão no ar é a deste commit)
        working-directory: .
        env:
          API_URL: ${{ steps.saida.outputs.api_url }}
        run: |
          python3 scripts/smoke.py "$API_URL" --versao "$GITHUB_SHA" --timeout 300
          echo "API no ar: $API_URL/docs" >> "$GITHUB_STEP_SUMMARY"
