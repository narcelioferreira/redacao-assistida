# --- ASI04 · Cadeia de suprimentos -----------------------------------------------------------

[[mutacao]]
id = "M12"
controle = "ASI04 · AST02"
descricao = "Action fixada por tag em vez de SHA"
arquivo = ".github/workflows/ci.yml"
de = 'uses: gitleaks/gitleaks-action@[0-9a-f]{40} # v[\d.]+'
para = 'uses: gitleaks/gitleaks-action@v3'
regex = true
comando = "pytest"

[[mutacao]]
id = "M13"
controle = "ASI04 · AST07"
descricao = "Imagem base sem digest"
arquivo = "Dockerfile"
de = '(FROM ghcr\.io/astral-sh/uv:[\d.]+)@sha256:[0-9a-f]{64}( AS uv)'
para = '\1\2'
regex = true
comando = "pytest"

[[mutacao]]
id = "M14"
controle = "ASI04 · AST02"
descricao = "Regra dos 14 dias desligada"
arquivo = "pyproject.toml"
de = 'exclude-newer = "14 days"'
para = 'exclude-newer = "0 days"'
comando = "pytest"

[[mutacao]]
id = "M15"
controle = "ASI04 · AST07"
descricao = "Deploy aceita tag móvel (latest)"
arquivo = "infra/variables.tf"
de = 'condition     = can(regex("^ghcr\\.io/[a-z0-9._/-]+:[0-9a-f]{7,40}$", var.image))'
para = 'condition     = can(regex("^.+:.+$", var.image))'
comando = "terraform"

[[mutacao]]
id = "M16"
controle = "ASI04"
descricao = "Segredo de repositório usado no workflow"
arquivo = ".github/workflows/cd.yml"
de = "          password: ${{ secrets.GITHUB_TOKEN }}"
para = "          password: ${{ secrets.GHCR_PAT }}"
comando = "pytest"

[[mutacao]]
id = "M17"
controle = "ASI04"
descricao = "Dependabot sem espera para as actions"
arquivo = ".github/dependabot.yml"
de = """    schedule: {interval: "weekly"}
    cooldown: {default-days: 14}
  # Imagens base"""
para = """    schedule: {interval: "weekly"}
  # Imagens base"""
comando = "pytest"

