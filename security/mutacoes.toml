de = 'SUBJECT="repo:${GITHUB_REPO%%/*}@${OWNER_ID}/${GITHUB_REPO#*/}@${REPO_ID}:environment:${GITHUB_ENVIRONMENT}"'
para = 'SUBJECT="repo:${GITHUB_REPO%%/*}@${OWNER_ID}/${GITHUB_REPO#*/}@${REPO_ID}:ref:refs/heads/*"'
comando = "pytest"

[[mutacao]]
id = "M24"
controle = "ASI03"
descricao = "Credencial federada sem os IDs imutáveis (aceitaria um repositório recriado com o mesmo nome)"
arquivo = "infra/bootstrap/bootstrap.sh"
de = 'SUBJECT="repo:${GITHUB_REPO%%/*}@${OWNER_ID}/${GITHUB_REPO#*/}@${REPO_ID}:environment:${GITHUB_ENVIRONMENT}"'
para = 'SUBJECT="repo:${GITHUB_REPO}:environment:${GITHUB_ENVIRONMENT}"'
comando = "pytest"

[[mutacao]]
