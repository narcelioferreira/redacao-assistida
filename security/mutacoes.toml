# Mutações dos controles de segurança (scripts/mutacao.py · docs/03-seguranca.md).
# Cada entrada desliga um controle trocando um trecho do arquivo; os testes do `comando` precisam
# falhar. Toda task que cria um controle acrescenta a sua mutação aqui.
# Trecho com versão, SHA ou digest usa `regex = true`: senão, cada PR do Dependabot quebraria a
# mutação (achado no PR #3).

# --- ASI03 · Identidade e privilégio ---------------------------------------------------------

[[mutacao]]
id = "M01"
controle = "ASI03"
descricao = "Erro 500 devolve a mensagem da exceção"
arquivo = "src/redacao/api/problems.py"
de = "    return problem_response(request, 500)"
para = "    return problem_response(request, 500, str(exc))"
comando = "pytest"

[[mutacao]]
id = "M02"
controle = "ASI03 · LGPD"
descricao = "Erro 422 ecoa o valor enviado"
arquivo = "src/redacao/api/problems.py"
de = '            mensagem=error["msg"],'
para = "            mensagem=f'{error[\"msg\"]}: {error.get(\"input\")}',"
comando = "pytest"

